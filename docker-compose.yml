services:
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - fulfillment_data:/data

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  fulfillment_data:
  caddy_data:
  caddy_config:

